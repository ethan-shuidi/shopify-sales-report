name: Shopify weekly report

on:
  schedule:
    - cron: "17 1 * * 1"
  workflow_dispatch:

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run weekly report
        env:
          SHOPIFY_STORES_JSON: ${{ secrets.SHOPIFY_STORES_JSON }}
          SHOPIFY_API_VERSION: ${{ secrets.SHOPIFY_API_VERSION }}
          SHOPIFY_TIMEZONE: ${{ secrets.SHOPIFY_TIMEZONE }}
          REPORT_TYPE: weekly
        run: node src/report.mjs
