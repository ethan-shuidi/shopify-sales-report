name: Shopify daily report

on:
  workflow_dispatch:
    inputs:
      diagnose_missing_sku:
        description: Only print orders with missing or unclassified SKU
        required: false
        type: boolean
        default: false
      dry_run:
        description: v2 only - print the card JSON without sending to Feishu
        required: false
        type: boolean
        default: false

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run daily report (v1)
        if: ${{ vars.REPORT_VERSION != 'v2' }}
        env:
          SHOPIFY_STORES_JSON: ${{ secrets.SHOPIFY_STORES_JSON }}
          SHOPIFY_API_VERSION: ${{ secrets.SHOPIFY_API_VERSION }}
          SHOPIFY_TIMEZONE: ${{ secrets.SHOPIFY_TIMEZONE }}
          MARKET_FILTER: US
          REPORT_TYPE: daily
          DIAGNOSE_MISSING_SKU: ${{ inputs.diagnose_missing_sku }}
        run: node src/report.mjs
      - name: Run rolling 7-day report (v1)
        if: ${{ !inputs.diagnose_missing_sku && vars.REPORT_VERSION != 'v2' }}
        env:
          SHOPIFY_STORES_JSON: ${{ secrets.SHOPIFY_STORES_JSON }}
          SHOPIFY_API_VERSION: ${{ secrets.SHOPIFY_API_VERSION }}
          SHOPIFY_TIMEZONE: ${{ secrets.SHOPIFY_TIMEZONE }}
          MARKET_FILTER: US
          REPORT_TYPE: rolling7
        run: node src/report.mjs

      - name: Run daily report (v2)
        if: ${{ vars.REPORT_VERSION == 'v2' }}
        env:
          SHOPIFY_STORES_JSON: ${{ secrets.SHOPIFY_STORES_JSON }}
          SHOPIFY_API_VERSION: ${{ secrets.SHOPIFY_API_VERSION }}
          SHOPIFY_TIMEZONE: ${{ secrets.SHOPIFY_TIMEZONE }}
          MARKET_FILTER: US
          REPORT_DAY: ${{ vars.REPORT_DAY || 'yesterday' }}
          DRY_RUN: ${{ inputs.dry_run }}
          WRITE_SNAPSHOT: ${{ inputs.dry_run && 'false' || 'true' }}
        run: node src/v2/report.mjs

      - name: Upload v2 snapshot
        if: ${{ vars.REPORT_VERSION == 'v2' && !inputs.dry_run }}
        uses: actions/upload-artifact@v4
        with:
          name: v2-snapshot-${{ github.run_id }}
          path: snapshots/
          if-no-files-found: ignore
          retention-days: 30

