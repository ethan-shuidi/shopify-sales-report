name: Shopify daily report

on:
  workflow_dispatch:
    inputs:
      diagnose_missing_sku:
        description: Only print orders with missing or unclassified SKU
        required: false
        type: boolean
        default: false

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run daily report
        env:
          SHOPIFY_STORES_JSON: ${{ secrets.SHOPIFY_STORES_JSON }}
          SHOPIFY_API_VERSION: ${{ secrets.SHOPIFY_API_VERSION }}
          SHOPIFY_TIMEZONE: ${{ secrets.SHOPIFY_TIMEZONE }}
          REPORT_TYPE: daily
          DIAGNOSE_MISSING_SKU: ${{ inputs.diagnose_missing_sku }}
        run: node src/report.mjs
