name: Shopify daily report

on:
  schedule:
    # 02:55 UTC = 10:55 Asia/Shanghai; temporary scheduling test.
    - cron: "55 2 * * *"
  workflow_dispatch:

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run daily report
        env:
          SHOPIFY_STORES_JSON: ${{ secrets.SHOPIFY_STORES_JSON }}
          SHOPIFY_API_VERSION: ${{ secrets.SHOPIFY_API_VERSION }}
          SHOPIFY_TIMEZONE: ${{ secrets.SHOPIFY_TIMEZONE }}
          REPORT_TYPE: daily
        run: node src/report.mjs
